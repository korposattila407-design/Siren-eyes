<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Siren Eyes</title>
<!-- Home Screen app: opens with no Safari bars, black status bar drawn over the page -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siren Eyes">
<meta name="theme-color" content="#050304">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#050304;--dim:#5a4c48;--glow:#ff3b12;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#snd{position:fixed;z-index:3;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.04);outline:1px solid rgba(201,191,184,.18);color:var(--dim);opacity:.6}
#snd[aria-pressed="true"]{color:var(--glow);opacity:.8;background:rgba(255,59,18,.08);outline-color:rgba(255,59,18,.3)}
#snd:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
#snd svg{width:20px;height:20px}
#snd .on{display:none}#snd[aria-pressed="true"] .on{display:block}#snd[aria-pressed="true"] .off{display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Two glowing eyes staring from the dark"></canvas>
<button id="snd" aria-label="Turn siren on" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <g class="off"><path d="M17 9l5 6M22 9l-5 6"/></g>
    <g class="on"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></g>
  </svg>
</button>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,200));size();

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let look={x:0,y:0},target={x:0,y:0},blink=0,nextBlink=performance.now()+2500,intensity=0.35,t0=performance.now();
function aim(e){target.x=(e.clientX/W-.5)*2;target.y=(e.clientY/H-.5)*2}
addEventListener('pointermove',aim);addEventListener('pointerdown',aim);

function eye(cx,cy,r,tilt,open,pulse){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);
  const g=ctx.createRadialGradient(0,0,r*.2,0,0,r*2.6);
  g.addColorStop(0,`rgba(255,80,20,${.28*pulse})`);g.addColorStop(1,'rgba(255,40,10,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.6,0,7);ctx.fill();
  const h=r*.62*open;
  ctx.beginPath();ctx.moveTo(-r*1.25,0);
  ctx.bezierCurveTo(-r*.5,-h*1.25,r*.6,-h*1.1,r*1.25,h*.1);
  ctx.bezierCurveTo(r*.5,h*1.1,-r*.6,h*1.05,-r*1.25,0);ctx.closePath();
  ctx.save();ctx.clip();
  const s=ctx.createRadialGradient(look.x*r*.35,look.y*r*.2,0,0,0,r*1.3);
  s.addColorStop(0,'#fff6c8');s.addColorStop(.35,'#ffd23a');s.addColorStop(.8,'#c2410c');s.addColorStop(1,'#3b0602');
  ctx.fillStyle=s;ctx.fillRect(-r*2,-r*2,r*4,r*4);
  ctx.strokeStyle='rgba(120,8,4,.55)';ctx.lineWidth=1;
  for(let i=0;i<9;i++){const a=i/9*6.28+.3;ctx.beginPath();let x=Math.cos(a)*r*1.3,y=Math.sin(a)*r*.7;ctx.moveTo(x,y);
    for(let k=0;k<3;k++){x*=.8;y*=.8;ctx.lineTo(x+Math.sin(i*7+k)*4,y+Math.cos(i*3+k)*3)}ctx.stroke()}
  const px=look.x*r*.45,py=look.y*r*.18,pw=r*(.09+.05*(1-pulse));
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(px,py,pw,r*.55,0,0,7);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,.9)';ctx.lineWidth=r*.08;ctx.stroke();
  ctx.restore();
}

function frame(now){
  look.x+=(target.x-look.x)*.06;look.y+=(target.y-look.y)*.06;
  if(!reduce&&now>nextBlink){blink=1;nextBlink=now+2000+Math.random()*4500}
  blink=Math.max(0,blink-.08);
  const open=1-Math.sin(Math.min(1,blink)*Math.PI)*.95;
  const pulse=intensity*(.75+.25*Math.sin((now-t0)/900));
  ctx.fillStyle='#050304';ctx.fillRect(0,0,W,H);
  const r=Math.min(W*.185,H*.3),gap=r*1.32,cy=H*.5+(reduce?0:Math.sin(now/2300)*4);
  eye(W/2-gap,cy,r,.22,open,pulse);eye(W/2+gap,cy,r,-.22,open,pulse);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Siren: detuned saws through soft distortion and a lowpass, one slow steady sine sweep up and down, sub rumble underneath
const PERIOD=7;
let ac,master,running=false,timer,lfoStart=0;
function curve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/n*2-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}
function build(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=0;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  const dist=ac.createWaveShaper();dist.curve=curve(8);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.Q.value=4;
  const delay=ac.createDelay(1);delay.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.38;
  delay.connect(fb);fb.connect(delay);
  dist.connect(lp);lp.connect(master);lp.connect(delay);delay.connect(master);
  const pitch=ac.createConstantSource();pitch.offset.value=240;pitch.start();
  [[1,0],[1.007,0],[1.5,-14],[2.01,-10]].forEach(([m,det])=>{
    const o=ac.createOscillator();o.type='sawtooth';o.detune.value=det;
    const mul=ac.createGain();mul.gain.value=m;pitch.connect(mul);o.frequency.value=0;mul.connect(o.frequency);
    const vg=ac.createGain();vg.gain.value=m<1.1?.35:.15;o.connect(vg);vg.connect(dist);o.start();
  });
  const lfo=ac.createOscillator();lfo.type='sine';lfo.frequency.value=1/PERIOD;
  const lg=ac.createGain();lg.gain.value=140;lfo.connect(lg);lg.connect(pitch.offset);
  const lf=ac.createGain();lf.gain.value=900;lfo.connect(lf);lf.connect(lp.frequency);
  lfo.start();lfoStart=ac.currentTime;
  const sub=ac.createOscillator();sub.type='sine';sub.frequency.value=48;const sg=ac.createGain();sg.gain.value=.22;
  sub.connect(sg);sg.connect(master);sub.start();
}
function wail(){
  if(!running)return;
  intensity=.55+.45*Math.sin((ac.currentTime-lfoStart)/PERIOD*2*Math.PI);
  timer=requestAnimationFrame(wail);
}
// iPad: play as media so the silent switch doesn't mute it; unlock audio on the first touch
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
function silentWav(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return 'data:audio/wav;base64,'+btoa(s)}
const keepAlive=new Audio(silentWav());keepAlive.loop=true;keepAlive.setAttribute('playsinline','');
function unlock(){
  if(!ac)build();
  if(ac.state!=='running')ac.resume().catch(()=>{});
  keepAlive.play().catch(()=>{});
}
addEventListener('touchend',unlock,{passive:true});addEventListener('pointerup',unlock);
// In Safari (not yet on the Home Screen) a tap also requests full screen, which iPad allows
function goFull(){
  const d=document,el=d.documentElement;
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
  if(d.fullscreenElement||d.webkitFullscreenElement)return;
  try{const p=(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);p&&p.catch&&p.catch(()=>{})}catch(e){}
}
addEventListener('fullscreenchange',size);addEventListener('webkitfullscreenchange',size);
addEventListener('pointerdown',goFull);
let wake;
const snd=document.getElementById('snd');
snd.addEventListener('click',async e=>{
  e.stopPropagation();
  unlock();
  if(ac.state!=='running'){try{await ac.resume()}catch(e){}}
  running=!running;
  const t=ac.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);
  if(running){
    master.gain.linearRampToValueAtTime(.8,t+1.2);wail();
    snd.setAttribute('aria-pressed','true');snd.setAttribute('aria-label','Turn siren off');
    try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  }else{
    master.gain.linearRampToValueAtTime(0,t+.6);cancelAnimationFrame(timer);intensity=.35;
    snd.setAttribute('aria-pressed','false');snd.setAttribute('aria-label','Turn siren on');
    try{wake&&wake.release()}catch(e){}
  }
});
// Works offline once opened
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
